services:
  newsnow:
    image: ghcr.io/ourongxing/newsnow:latest
    container_name: newsnow
    ports:
      - '4444:4444'
    volumes:
      - ${HOST_DATA_DIR:-../../state/events}:/data/events
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - DATA_DIR=/data/events
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - PRODUCTHUNT_API_TOKEN=
